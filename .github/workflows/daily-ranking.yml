name: StarMomentum ranking update

on:
  # Primary trigger: an external scheduler (cron-job.org) calls the workflow_dispatch API at
  # 08:00, 16:00 and 00:00 Hong Kong time. GitHub's own schedule below ran 3-7 hours late here,
  # so it is only a backup and skips itself when the site was updated recently.
  workflow_dispatch:
  schedule:
    # Hours are UTC: 23:47, 07:47 and 15:47 UTC = 07:47, 15:47 and 23:47 Hong Kong time (UTC+8).
    - cron: '47 7,15,23 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-ranking
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Read the last update time
        uses: actions/checkout@v5
        with:
          sparse-checkout: public/data/current.json
          sparse-checkout-cone-mode: false

      - name: Decide whether this run is needed
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Manual and external runs always update; a late backup run skips a site updated in the last 6 hours.
          if [ "$EVENT" != "schedule" ] || [ ! -f public/data/current.json ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          generated=$(node -p "require('./public/data/current.json').generatedAt")
          age=$(( $(date +%s) - $(date -d "$generated" +%s) ))
          echo "Last update $((age / 60)) minutes ago."
          if [ "$age" -ge 21600 ]; then echo "stale=true" >> "$GITHUB_OUTPUT"; else echo "stale=false" >> "$GITHUB_OUTPUT"; fi

  update-and-deploy:
    needs: freshness
    if: needs.freshness.outputs.stale == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate today's ranking
        run: pnpm daily
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          STAR_AUDIT_TOKEN: ${{ secrets.STAR_AUDIT_TOKEN }}

      - name: Verify ranking and website
        run: |
          pnpm test
          pnpm build

      - name: Save generated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/snapshots reports
          git diff --cached --quiet || git commit -m "data: update daily ranking"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
